services:
  postgres:
    image: postgres:16-alpine
    container_name: taskq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskq
      POSTGRES_PASSWORD: taskq
      POSTGRES_DB: taskq
    ports:
      - "5433:5432"
    volumes:
      - taskq_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskq -d taskq"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: taskq_jaeger
    ports:
      - "16687:16686"     # Jaeger UI (different from python-learning's 16686)
      - "4319:4317"       # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: taskq_prometheus
    ports:
      - "9091:9090"       # Prometheus UI (different from python-learning's 9090)
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

volumes:
  taskq_pg_data: